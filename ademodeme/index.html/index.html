<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ödeme Bilgileri - Adem Erdoğan</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            width: 100%;
            overflow-x: hidden;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .card {
            width: 100%;
            max-width: 420px;
            background: white;
            border-radius: 20px;
            padding: 30px 24px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.10);
            text-align: center;
            overflow: hidden;
        }

        .icon {
            width: 65px;
            height: 65px;
            background: #eeeeee;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 18px;
            font-size: 30px;
        }

        h1 {
            font-size: 24px;
            color: #222;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #777;
            font-size: 15px;
            margin-bottom: 25px;
        }

        .info {
            width: 100%;
            text-align: left;
            background: #f7f7f7;
            border-radius: 14px;
            padding: 16px;
            margin-bottom: 12px;
            overflow: hidden;
        }

        .label {
            font-size: 12px;
            color: #777;
            margin-bottom: 8px;
        }

        .value-row {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            min-width: 0;
        }

        .value {
            min-width: 0;
            flex: 1;
            font-size: 16px;
            font-weight: bold;
            color: #222;
            overflow-wrap: anywhere;
            word-break: break-word;
        }

        .iban {
            letter-spacing: 0.3px;
        }

        .copy-btn {
            flex-shrink: 0;
            border: none;
            border-radius: 9px;
            padding: 8px 11px;
            background: #222;
            color: white;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s ease;
            white-space: nowrap;
        }

        .copy-btn:hover {
            background: #444;
        }

        .copy-btn:active {
            transform: scale(0.95);
        }

        #message {
            margin-top: 14px;
            color: #16803c;
            font-size: 14px;
            font-weight: bold;
            min-height: 20px;
        }

        .note {
            margin-top: 22px;
            font-size: 12px;
            color: #888;
            line-height: 1.5;
        }

        @media (max-width: 400px) {

            body {
                padding: 12px;
            }

            .card {
                padding: 25px 18px;
            }

            .value {
                font-size: 14px;
            }

            .copy-btn {
                padding: 7px 9px;
                font-size: 11px;
            }
        }
    </style>
</head>

<body>

    <div class="card">

        <div class="icon">💳</div>

        <h1>Ödeme Bilgileri</h1>

        <p class="subtitle">
            Ödeme yapmak için aşağıdaki bilgileri kullanabilirsiniz.
        </p>


        <!-- Alıcı -->
        <div class="info">

            <div class="label">Alıcı</div>

            <div class="value-row">

                <div class="value">
                    Adem Erdoğan
                </div>

                <button
                    class="copy-btn"
                    onclick="copyText('Adem Erdoğan', this)">
                    Kopyala
                </button>

            </div>

        </div>


        <!-- Banka -->
        <div class="info">

            <div class="label">Banka</div>

            <div class="value">
                Kuveyt Türk
            </div>

        </div>


        <!-- IBAN -->
        <div class="info">

            <div class="label">IBAN</div>

            <div class="value-row">

                <div class="value iban">
                    TR28 0020 5000 0946 2671 2000 01
                </div>

                <button
                    class="copy-btn"
                    onclick="copyText('TR280020500009462671200001', this)">
                    Kopyala
                </button>

            </div>

        </div>


        <div id="message"></div>


        <div class="note">
            Bilgilerin yanındaki "Kopyala" butonunu kullanarak
            ödeme bilgilerini kolayca kopyalayabilirsiniz.
        </div>

    </div>


    <script>

        function copyText(text, button) {

            navigator.clipboard.writeText(text).then(function () {

                const oldText = button.innerText;

                button.innerText = "✓ Kopyalandı";

                document.getElementById("message").innerText =
                    "Bilgi başarıyla kopyalandı.";

                setTimeout(function () {
                    button.innerText = oldText;
                }, 2000);

                setTimeout(function () {
                    document.getElementById("message").innerText = "";
                }, 2500);

            }).catch(function () {

                document.getElementById("message").innerText =
                    "Kopyalama başarısız oldu. Lütfen manuel olarak kopyalayın.";

            });

        }

    </script>

</body>
</html>
